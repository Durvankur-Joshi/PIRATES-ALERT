<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Catalogue Produits Maison</title>
</head>
<body>
  <main class="main-content">
    <div class="product-list-view">
      <div class="product-item" data-item-id="CF-770">
        <div class="visual">
          <img data-original="/media/coffee.webp" alt="Cafetière">
        </div>
        <div class="details">
          <h2 class="title">
            <a href="/p/coffee-maker-99?id=CF-770">Cafetière Espresso Automatique 15 Bars</a>
          </h2>
          <div class="customer-reviews" data-rating="4.8">
            <span class="note">4.8 / 5</span>
            <span class="reviews-count">210 avis</span>
          </div>
          <div class="tarifs">
            <span class="prix-actuel">149,99 €</span>
            <s class="strike">189,99 €</s>
          </div>
        </div>
      </div>

      <div class="product-item">
        <div class="visual">
          <img srcset="/media/jacket-300.jpg 300w, /media/jacket-600.jpg 600w" alt="Manteau">
        </div>
        <div class="details">
          <h2 class="title">
            <a href="/catalogue/jacket-winter">Manteau Hiver Imperméable Unisexe</a>
          </h2>
          <div class="tarifs">
            <span class="prix-actuel">89,00 €</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
